<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Kancil</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/icon.png">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/site.css">
<style>.stores{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.store-btn{display:inline-block;background:#000;color:#fff!important;text-decoration:none;border-radius:12px;padding:10px 20px;font:600 20px/1.1 -apple-system,system-ui,sans-serif;box-shadow:0 4px 0 rgba(0,0,0,.18)}.store-btn small{display:block;font-size:12px;opacity:.85}</style>
<script>
  // One link for the parent outreach: phones go straight to their store's
  // review page; everyone else picks below. No tracking, nothing stored.
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
    if (ios) location.replace('https://apps.apple.com/app/id6789944706?action=write-review');
    else if (/Android/.test(ua)) location.replace('https://play.google.com/store/apps/details?id=com.rzeestudios.kancil&showAllReviews=true');
  })();
</script>
</head>
<body>

<nav>
  <a class="lockup" href="/" aria-label="Kancil home"><img class="still" src="/assets/img/logo-t.webp" alt=""></a>
</nav>

<main class="doc">
  <h1>Rate Kancil</h1>
  <p class="eff">Thank you! An honest review helps other parents find Kancil. Pick your store:</p>
  <div class="stores">
    <a class="store-btn" href="https://apps.apple.com/app/id6789944706?action=write-review"><span><small>iPhone</small>App Store</span></a>
    <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.rzeestudios.kancil&showAllReviews=true"><span><small>Android</small>Google Play</span></a>
  </div>
</main>

</body>
</html>
